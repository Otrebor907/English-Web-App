<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Percorso di inglese per adulti italiani" />
    <title>Prima conversazione</title>

    <!-- Preconnect serve a velocizzare il caricamento dei font da Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Import dei font usati dall'app (Plus Jakarta Sans e JetBrains Mono) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Punto di montaggio React: qui React sostituisce il contenuto con l'app -->
    <div id="root"></div>
    <!--
      Lo script principale di Vite/React:
      - viene eseguito come modulo ES
      - importa `frontend/src/main.jsx`
      - da lì avvia React e monta `<App />` dentro `#root`
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
