services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-english_app}
      POSTGRES_USER: ${POSTGRES_USER:-english_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-development-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      POSTGRES_DB: ${POSTGRES_DB:-english_app}
      POSTGRES_USER: ${POSTGRES_USER:-english_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      # Il Postgres di questo compose gira sulla rete interna di Docker e non
      # espone TLS: senza questa riga il default "require" di settings.py
      # (pensato per Neon) farebbe fallire la connessione.
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"]
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./programma_lezioni_inglese_no_audio.xlsx:/data/programma_lezioni_inglese_no_audio.xlsx:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
